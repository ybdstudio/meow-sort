<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a6fc2">
<title>Meow Sort — H5 Prototype</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #2f5fae; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
  }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff;
    font: 600 16px system-ui, sans-serif; text-align: center; padding: 24px; background: #2f5fae; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="err"></div>
<noscript><div style="color:#fff;font:16px sans-serif;padding:24px">Meow Sort needs JavaScript enabled.</div></noscript>
<script>
/* =====================================================================
   MEOW SORT — HTML5 prototype (single file, no dependencies)

   Documented gameplay assumptions (anything not established by the
   reference screenshots is configurable in CONFIG):
   - Shelf capacity 5. A shelf holding 5 cats of one colour completes
     (green checks, cats sleep, then fly into the hanging pod and the
     shelf empties). Shown in the reference screenshots.
   - Cats are packed against the wall: left column against the left
     edge, right column against the right edge (as in the screenshots).
     A moved cat lands at the open end of the destination shelf.
   - accessRule 'edge' (fixed): only the OUTERMOST cat of a shelf (the one
     at the open end, farthest from the wall) can be picked. Inner cats are
     blocked until every cat in front of them has been moved away.
   - Group move: when 2+ cats of the same colour sit side by side at the
     outer end, tapping any of them lifts the whole group, and they all move
     to the destination as long as it has room (if it has less room, as many
     as fit move and the rest stay).
   - The two purple beds are 1-cat holding slots (assumption).
   - Undo history is cleared after a completed group (the reference shows
     the undo button struck out right after a match). Configurable.
   - Selection is single-cat (one cat lifts in the reference).
   - Art: costume-cat sprites from the supplied art sheet (embedded),
     expressions painted per mood at start-up. Game logic is unchanged.
   ===================================================================== */
(function () {
'use strict';

/* ===================== CORE: pure game logic (no DOM) ===================== */
/*CORE_START*/
var CORE = (function () {
  var CONFIG = {
    shelfCapacity: 5,
    matchSize: 5,
    bedCapacity: 1,
    accessRule: 'edge',       // only the outermost cat can be picked
    groupMove: true,          // a run of same-colour cats at the outer end moves together
    undoAcrossMatch: false,
    starsPerMatch: 1,
    coinsPerLevel: 50,
    startCoins: 1100,
    shuffleUses: 1,
    extraBedUses: 1
  };
  var COLOR_CODES = { R: 'red', B: 'blue', G: 'green', Y: 'yellow', P: 'pink' };
  var COLOR_LETTER = { red: 'R', blue: 'B', green: 'G', yellow: 'Y', pink: 'P' };

  // Strings list cats from the WALL outward (left column: left->right,
  // right column: right->left as seen on screen).
  var LEVELS = [
    { name: 'Tutorial', rowsL: [1, 2, 3], rowsR: [1, 2, 3], beds: 2,
      left: ['RRBB', 'YYR', 'BY'], right: ['RRY', 'BBY', ''] },
    { name: 'Standard', beds: 2,
      left: ['BPP', 'RGG', 'BRY', 'PBB', 'BPP'],
      right: ['YGG', 'G', '', 'RRR', 'YYY'] },
    { name: 'Advanced', beds: 2,
      left: ['YYYG', 'YRPB', 'GYBP', 'PBBR', 'RYRY'],
      right: ['BRRB', 'GGBB', 'BRGY', 'YRPY', 'PRBR'] }
  ];

  function buildBoard(def) {
    var nextId = 1, containers = [];
    var rowsL = def.rowsL || def.left.map(function (_, i) { return i; });
    var rowsR = def.rowsR || def.right.map(function (_, i) { return i; });
    function mk(side, row, str) {
      return {
        id: side + '_' + (row + 1), kind: 'shelf', side: side, row: row,
        capacity: CONFIG.shelfCapacity, completed: false,
        cats: str.split('').map(function (ch) { return { id: nextId++, color: COLOR_CODES[ch] }; })
      };
    }
    def.left.forEach(function (s, i) { containers.push(mk('left', rowsL[i], s)); });
    def.right.forEach(function (s, i) { containers.push(mk('right', rowsR[i], s)); });
    for (var b = 0; b < (def.beds || 0); b++) {
      containers.push({ id: 'bed_' + (b + 1), kind: 'bed', side: 'bottom', row: b,
        capacity: CONFIG.bedCapacity, completed: false, cats: [] });
    }
    return { containers: containers, nextId: nextId };
  }

  function validateLevel(def) {
    var errors = [], counts = {};
    def.left.concat(def.right).forEach(function (s, i) {
      if (s.length > CONFIG.shelfCapacity) errors.push('shelf ' + i + ' over capacity');
      for (var k = 0; k < s.length; k++) {
        if (!COLOR_CODES[s[k]]) errors.push('bad colour ' + s[k]);
        counts[s[k]] = (counts[s[k]] || 0) + 1;
      }
      if (s.length === CONFIG.matchSize && s.split('').every(function (c) { return c === s[0]; }))
        errors.push('shelf ' + i + ' starts completed');
    });
    Object.keys(counts).forEach(function (c) {
      if (counts[c] % CONFIG.matchSize) errors.push('colour ' + c + ' count ' + counts[c] + ' not a multiple of ' + CONFIG.matchSize);
    });
    return errors;
  }

  function getC(board, id) {
    for (var i = 0; i < board.containers.length; i++) if (board.containers[i].id === id) return board.containers[i];
    return null;
  }
  function accessible(cont, idx, rule) {
    if (!cont || cont.completed) return false;
    if (idx < 0 || idx >= cont.cats.length) return false;
    return rule === 'any' ? true : idx === cont.cats.length - 1;
  }
  function canMove(board, srcId, idx, dstId, rule) {
    var s = getC(board, srcId), d = getC(board, dstId);
    if (!s || !d) return { ok: false, reason: 'missing' };
    if (s === d) return { ok: false, reason: 'same' };
    if (!accessible(s, idx, rule)) return { ok: false, reason: 'blocked' };
    if (d.completed) return { ok: false, reason: 'locked' };
    if (d.cats.length >= d.capacity) return { ok: false, reason: 'full' };
    return { ok: true };
  }
  // Number of same-colour cats in a row at the outer (open) end of a container.
  function runLength(cont) {
    var cs = cont.cats, n = cs.length; if (!n) return 0;
    var r = 1; while (r < n && cs[n - 1 - r].color === cs[n - 1].color) r++;
    return r;
  }
  // How many cats a move carries: the whole outer run, limited by the free space at the destination.
  function moveCount(board, srcId, idx, dstId, rule) {
    var s = getC(board, srcId), d = getC(board, dstId);
    if (!s || !d) return 0;
    if (!CONFIG.groupMove || (rule || CONFIG.accessRule) !== 'edge' || idx !== s.cats.length - 1) return 1;
    return Math.max(1, Math.min(runLength(s), d.capacity - d.cats.length));
  }
  // Returns the moved cats, outermost first (it jumps first and lands deepest).
  function applyMove(board, srcId, idx, dstId, rule) {
    var s = getC(board, srcId), d = getC(board, dstId);
    var n = moveCount(board, srcId, idx, dstId, rule);
    var moved = s.cats.splice(idx - n + 1, n).reverse();
    moved.forEach(function (c) { d.cats.push(c); });
    return moved;
  }
  function isMatch(cont) {
    if (cont.kind !== 'shelf' || cont.completed) return false;
    if (cont.cats.length !== CONFIG.matchSize) return false;
    var c = cont.cats[0].color;
    for (var i = 1; i < cont.cats.length; i++) if (cont.cats[i].color !== c) return false;
    return true;
  }
  function findMatches(board) {
    return board.containers.filter(isMatch).map(function (c) { return c.id; });
  }
  function catCount(board) {
    var n = 0; board.containers.forEach(function (c) { n += c.cats.length; }); return n;
  }
  function isWon(board) { return catCount(board) === 0; }
  function snapshot(board) {
    return board.containers.map(function (c) {
      return { id: c.id, completed: c.completed, cats: c.cats.map(function (k) { return { id: k.id, color: k.color }; }) };
    });
  }
  function restore(board, snap) {
    var m = {}; snap.forEach(function (s) { m[s.id] = s; });
    board.containers.forEach(function (c) {
      var s = m[c.id];
      c.cats = s ? s.cats.map(function (k) { return { id: k.id, color: k.color }; }) : [];
      c.completed = s ? s.completed : false;
    });
  }
  function hasAnyMove(board, rule) {
    var cs = board.containers;
    for (var i = 0; i < cs.length; i++) {
      for (var k = 0; k < cs[i].cats.length; k++) {
        if (!accessible(cs[i], k, rule)) continue;
        for (var j = 0; j < cs.length; j++) if (canMove(board, cs[i].id, k, cs[j].id, rule).ok) return true;
      }
    }
    return false;
  }
  // Integrity: every cat id unique, nothing over capacity.
  function checkIntegrity(board) {
    var seen = {}, problems = [];
    board.containers.forEach(function (c) {
      if (c.cats.length > c.capacity) problems.push(c.id + ' over capacity');
      c.cats.forEach(function (k) { if (seen[k.id]) problems.push('duplicate cat ' + k.id); seen[k.id] = 1; });
    });
    return problems;
  }

  /* ---------- Solver (greedy best-first with visited set) ---------- */
  function Heap() { this.a = []; }
  Heap.prototype.push = function (n) {
    var a = this.a; a.push(n); var i = a.length - 1;
    while (i > 0) { var p = (i - 1) >> 1; if (a[p].f <= a[i].f) break; var t = a[p]; a[p] = a[i]; a[i] = t; i = p; }
  };
  Heap.prototype.pop = function () {
    var a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; var i = 0;
      for (;;) {
        var l = 2 * i + 1, r = l + 1, m = i;
        if (l < a.length && a[l].f < a[m].f) m = l;
        if (r < a.length && a[r].f < a[m].f) m = r;
        if (m === i) break; var t = a[m]; a[m] = a[i]; a[i] = t; i = m;
      }
    }
    return top;
  };

  function solve(board, rule, maxNodes) {
    rule = rule || CONFIG.accessRule; maxNodes = maxNodes || 80000;
    var cs = board.containers;
    var caps = cs.map(function (c) { return c.capacity; });
    var shelf = cs.map(function (c) { return c.kind === 'shelf'; });
    var M = CONFIG.matchSize, group = CONFIG.groupMove && rule === 'edge';
    var start = cs.map(function (c) {
      return c.completed ? '' : c.cats.map(function (k) { return COLOR_LETTER[k.color]; }).join('');
    });
    function key(st) {
      var sh = [], bd = [];
      for (var i = 0; i < st.length; i++) {
        var v = rule === 'any' ? st[i].split('').sort().join('') : st[i];
        (shelf[i] ? sh : bd).push(v);
      }
      return sh.sort().join('|') + '#' + bd.sort().join('|');
    }
    function h(st) {
      var dis = 0, spread = 0, total = 0, colorSeen = {};
      for (var i = 0; i < st.length; i++) {
        var s = st[i]; if (!s) continue; total += s.length;
        var cnt = {}, mx = 0;
        for (var k = 0; k < s.length; k++) { cnt[s[k]] = (cnt[s[k]] || 0) + 1; if (cnt[s[k]] > mx) mx = cnt[s[k]]; }
        if (shelf[i]) dis += s.length - mx; else dis += s.length * 1.5;
        for (var c in cnt) { spread++; colorSeen[c] = 1; }
      }
      return dis * 2 + spread + total * 0.05;
    }
    var root = { st: start, g: 0, parent: null, move: null };
    root.f = h(start);
    var open = new Heap(); open.push(root);
    var seen = {}; seen[key(start)] = 1;
    var nodes = 0;
    while (open.a.length) {
      var n = open.pop(); nodes++;
      var st = n.st, done = true;
      for (var q = 0; q < st.length; q++) if (st[q]) { done = false; break; }
      if (done) {
        var moves = []; for (var p = n; p.move; p = p.parent) moves.unshift(p.move);
        return { solved: true, moves: moves, nodes: nodes };
      }
      if (nodes > maxNodes) return { solved: false, moves: null, nodes: nodes, exhausted: false };
      for (var i = 0; i < st.length; i++) {
        var s = st[i]; if (!s) continue;
        var idxs = [];
        if (rule === 'any') {
          var used = {};
          for (var k = s.length - 1; k >= 0; k--) if (!used[s[k]]) { used[s[k]] = 1; idxs.push(k); }
        } else idxs.push(s.length - 1);
        for (var a = 0; a < idxs.length; a++) {
          var idx = idxs[a], ch = s[idx];
          var emptyShelfTried = false, emptyBedTried = false;
          for (var j = 0; j < st.length; j++) {
            if (j === i) continue;
            var d = st[j];
            if (d.length >= caps[j]) continue;
            var cnt = 1;
            if (group && idx === s.length - 1) {
              var run = 1; while (run < s.length && s[s.length - 1 - run] === ch) run++;
              cnt = Math.min(run, caps[j] - d.length);
            }
            if (!d.length) {
              if (shelf[j]) { if (emptyShelfTried) continue; emptyShelfTried = true; }
              else { if (emptyBedTried) continue; emptyBedTried = true; }
              if (cnt === s.length && shelf[i] === shelf[j]) continue;      // moving a whole shelf to an empty one: pointless
            }
            var ns = st.slice();
            ns[i] = s.slice(0, idx - cnt + 1) + s.slice(idx + 1);
            var nd = d; for (var q = 0; q < cnt; q++) nd += ch;
            if (shelf[j] && nd.length === M) {
              var same = true; for (var z = 1; z < M; z++) if (nd[z] !== nd[0]) { same = false; break; }
              if (same) nd = '';
            }
            ns[j] = nd;
            var kk = key(ns); if (seen[kk]) continue; seen[kk] = 1;
            var child = { st: ns, g: n.g + 1, parent: n, move: { src: cs[i].id, idx: idx, dst: cs[j].id } };
            child.f = h(ns) + child.g * 0.02;
            open.push(child);
          }
        }
      }
    }
    return { solved: false, moves: null, nodes: nodes, exhausted: true };
  }

  /* ---------- Seeded RNG + procedural level generator ---------- */
  function rng(seed) {
    var s = seed >>> 0 || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function generateLevel(n, rule) {
    var r = rng(9137 + n * 7919);
    var groups = Math.min(8, 5 + Math.floor((n - 3) / 2));
    for (var attempt = 0; attempt < 40; attempt++) {
      var letters = 'RBGYP'.split(''), pool = [];
      for (var g = 0; g < groups; g++) {
        var c = g < 5 ? letters[g] : letters[Math.floor(r() * 5)];
        for (var k = 0; k < CONFIG.matchSize; k++) pool.push(c);
      }
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      var shelves = ['', '', '', '', '', '', '', '', '', ''], maxPer = 4, p = 0;
      while (p < pool.length) {
        var si = Math.floor(r() * 10);
        if (shelves[si].length < maxPer) shelves[si] += pool[p++];
      }
      var def = { name: 'Level ' + (n + 1), beds: 2, left: shelves.slice(0, 5), right: shelves.slice(5) };
      if (validateLevel(def).length) continue;
      var res = solve(buildBoard(def), rule, 40000);
      if (res.solved) { def.verified = { rule: rule, moves: res.moves.length }; return def; }
    }
    return LEVELS[1];
  }

  function verifyAllLevels(rules) {
    rules = rules || ['any', 'edge'];
    var out = [];
    LEVELS.forEach(function (def, i) {
      var v = validateLevel(def);
      rules.forEach(function (rule) {
        var t0 = Date.now();
        var res = solve(buildBoard(def), rule, 300000);
        out.push({ level: i + 1, name: def.name, rule: rule, valid: v.length === 0, errors: v,
          solved: res.solved, solutionMoves: res.solved ? res.moves.length : null, nodes: res.nodes, ms: Date.now() - t0 });
      });
    });
    return out;
  }

  return {
    CONFIG: CONFIG, LEVELS: LEVELS, COLOR_CODES: COLOR_CODES,
    buildBoard: buildBoard, validateLevel: validateLevel, getC: getC, accessible: accessible,
    canMove: canMove, applyMove: applyMove, runLength: runLength, moveCount: moveCount, isMatch: isMatch, findMatches: findMatches,
    catCount: catCount, isWon: isWon, snapshot: snapshot, restore: restore, hasAnyMove: hasAnyMove,
    checkIntegrity: checkIntegrity, solve: solve, rng: rng, generateLevel: generateLevel,
    verifyAllLevels: verifyAllLevels
  };
})();
/*CORE_END*/

/* ===================== GAME STATE MACHINE ===================== */
var S = { READY: 'READY', CAT_SELECTED: 'CAT_SELECTED', MOVING: 'MOVING',
  MATCH_COMPLETING: 'MATCH_COMPLETING', LEVEL_COMPLETE: 'LEVEL_COMPLETE', PAUSED: 'PAUSED' };

function Game(fx) {
  this.fx = fx;                // presentation hooks (AnimationManager / UI)
  this.state = S.READY;
  this.levelIndex = 0;
  this.levelDef = null;
  this.board = null;
  this.sel = null;             // { contId, catId }
  this.history = [];
  this.moves = 0;
  this.stars = 0;
  this.coins = CORE.CONFIG.startCoins;
  this.boosters = { shuffle: 0, bed: 0 };
  this.pausedFrom = null;
  this.matchedThisLevel = 0;
}
Game.prototype.rule = function () { return CORE.CONFIG.accessRule; };
Game.prototype.levelCount = function () { return CORE.LEVELS.length; };
Game.prototype.getLevelDef = function (i) {
  if (i < CORE.LEVELS.length) return CORE.LEVELS[i];
  return CORE.generateLevel(i, this.rule());
};
Game.prototype.loadLevel = function (i) {
  this.levelIndex = i;
  this.levelDef = this.getLevelDef(i);
  this.board = CORE.buildBoard(this.levelDef);
  this.sel = null; this.history = []; this.moves = 0; this.stars = 0; this.matchedThisLevel = 0;
  this.boosters = { shuffle: CORE.CONFIG.shuffleUses, bed: CORE.CONFIG.extraBedUses };
  this.state = S.READY;
  this.fx.onLoad();
};
Game.prototype.restartLevel = function () { this.loadLevel(this.levelIndex); };
Game.prototype.nextLevel = function () { this.loadLevel(this.levelIndex + 1); };
Game.prototype.inputOpen = function () { return this.state === S.READY || this.state === S.CAT_SELECTED; };

Game.prototype.selectCat = function (contId, idx) {
  if (!this.inputOpen()) return false;
  var c = CORE.getC(this.board, contId);
  if (!c || c.completed || !c.cats[idx]) return false;
  if (this.isPickable(c, idx)) idx = c.cats.length - 1;          // any cat of the outer same-colour run picks the run
  var cat = c.cats[idx];
  if (!CORE.accessible(c, idx, this.rule())) { this.fx.onBlocked(cat.id, contId); return false; }   // inner cat: not selectable
  if (this.state === S.CAT_SELECTED && this.sel && this.sel.catId === cat.id) { this.deselect(); return true; }
  this.sel = { contId: contId, catId: cat.id };
  this.state = S.CAT_SELECTED;
  this.fx.onSelect(cat.id);
  return true;
};
// A cat can be tapped to pick if it is the outermost cat or part of the outer same-colour run.
Game.prototype.isPickable = function (c, idx) {
  if (!c || c.completed || idx < 0 || idx >= c.cats.length) return false;
  if (CORE.accessible(c, idx, this.rule())) return true;
  return this.rule() === 'edge' && CORE.CONFIG.groupMove && idx >= c.cats.length - CORE.runLength(c);
};
// Ids of every cat lifted by the current selection (the whole outer run).
Game.prototype.selectedIds = function () {
  if (!this.sel) return [];
  var c = CORE.getC(this.board, this.sel.contId); if (!c || !c.cats.length) return [];
  var n = (this.rule() === 'edge' && CORE.CONFIG.groupMove) ? CORE.runLength(c) : 1;
  if (this.rule() !== 'edge') return [this.sel.catId];
  return c.cats.slice(c.cats.length - n).map(function (k) { return k.id; });
};
Game.prototype.deselect = function () {
  if (this.state === S.CAT_SELECTED) { this.sel = null; this.state = S.READY; this.fx.onDeselect(); }
};
Game.prototype.selectedIndex = function () {
  if (!this.sel) return -1;
  var c = CORE.getC(this.board, this.sel.contId);
  if (!c) return -1;
  for (var i = 0; i < c.cats.length; i++) if (c.cats[i].id === this.sel.catId) return i;
  return -1;
};
Game.prototype.canMove = function (srcId, idx, dstId) { return CORE.canMove(this.board, srcId, idx, dstId, this.rule()); };
Game.prototype.selectShelf = function (dstId) {
  if (this.state !== S.CAT_SELECTED || !this.sel) return false;
  var idx = this.selectedIndex();
  var r = this.canMove(this.sel.contId, idx, dstId);
  if (!r.ok) { this.fx.onInvalid(this.sel.catId, dstId, r.reason); return false; }
  this.moveCat(this.sel.contId, idx, dstId);
  return true;
};
Game.prototype.pushHistory = function () {
  this.history.push({ snap: CORE.snapshot(this.board), stars: this.stars });
  if (this.history.length > 200) this.history.shift();
};
Game.prototype.moveCat = function (srcId, idx, dstId) {
  this.pushHistory();
  var moved = CORE.applyMove(this.board, srcId, idx, dstId, this.rule());
  this.moves++;
  this.sel = null;
  this.state = S.MOVING;
  this.fx.onMove(moved.map(function (k) { return k.id; }), srcId, dstId);
};
// Called by the animation layer once every cat has landed.
Game.prototype.onSettled = function () {
  if (this.state !== S.MOVING) return;
  var m = this.checkMatch();
  if (m.length) {
    var self = this;
    m.forEach(function (id) { CORE.getC(self.board, id).completed = true; });
    this.state = S.MATCH_COMPLETING;
    this.fx.onMatch(m);
    return;
  }
  this.state = S.READY;
  if (!this.checkWin() && !CORE.hasAnyMove(this.board, this.rule())) this.fx.onNoMoves();
  this.fx.onReady();
};
Game.prototype.checkMatch = function () { return CORE.findMatches(this.board); };
Game.prototype.completeShelf = function (id) {
  var c = CORE.getC(this.board, id);
  if (!c || !c.completed) return;
  c.cats = []; c.completed = false;
  this.stars += CORE.CONFIG.starsPerMatch;
  this.matchedThisLevel++;
  if (!CORE.CONFIG.undoAcrossMatch) this.history = [];
};
Game.prototype.finishMatchSequence = function () {
  if (this.state !== S.MATCH_COMPLETING) return;
  if (this.checkWin()) {
    this.state = S.LEVEL_COMPLETE;
    this.coins += CORE.CONFIG.coinsPerLevel;
    this.fx.onWin();
  } else {
    this.state = S.READY;
    if (!CORE.hasAnyMove(this.board, this.rule())) this.fx.onNoMoves();
    this.fx.onReady();
  }
};
Game.prototype.checkWin = function () { return CORE.isWon(this.board); };
Game.prototype.canUndo = function () { return this.inputOpen() && this.history.length > 0; };
Game.prototype.undoMove = function () {
  if (!this.canUndo()) return false;
  var h = this.history.pop();
  CORE.restore(this.board, h.snap);
  this.stars = h.stars;
  this.moves = Math.max(0, this.moves - 1);
  this.sel = null;
  this.state = S.MOVING;
  this.fx.onUndo();
  return true;
};
Game.prototype.shuffle = function () {
  if (!this.inputOpen() || this.boosters.shuffle <= 0) return false;
  var rule = this.rule(), board = this.board;
  var conts = board.containers.filter(function (c) { return !c.completed; });
  var cats = []; conts.forEach(function (c) { c.cats.forEach(function (k) { cats.push(k); }); });
  if (cats.length < 2) return false;
  var r = CORE.rng((Date.now() & 0xffffff) + 17), best = null;
  for (var attempt = 0; attempt < 12 && !best; attempt++) {
    var pool = cats.slice();
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    var test = { containers: board.containers.map(function (c) { return { id: c.id, kind: c.kind, capacity: c.capacity, completed: c.completed, cats: c.cats.slice() }; }) };
    var p = 0;
    test.containers.forEach(function (c) { if (!c.completed) { var n = c.cats.length; c.cats = pool.slice(p, p + n); p += n; } });
    if (CORE.findMatches(test).length) continue;
    if (CORE.solve(test, rule, 25000).solved) best = test;
  }
  if (!best) { this.fx.toast('No better arrangement found'); return false; }
  this.pushHistory();
  var self = this;
  best.containers.forEach(function (tc) { CORE.getC(self.board, tc.id).cats = tc.cats; });
  this.boosters.shuffle--;
  this.sel = null;
  this.state = S.MOVING;
  this.fx.onShuffle();
  return true;
};
Game.prototype.addBed = function () {
  if (!this.inputOpen() || this.boosters.bed <= 0) return false;
  var beds = this.board.containers.filter(function (c) { return c.kind === 'bed'; });
  if (beds.length >= 3) return false;
  this.board.containers.push({ id: 'bed_' + (beds.length + 1), kind: 'bed', side: 'bottom', row: beds.length,
    capacity: CORE.CONFIG.bedCapacity, completed: false, cats: [] });
  this.boosters.bed--;
  this.fx.onBedAdded();
  return true;
};
Game.prototype.pause = function () {
  if (this.state === S.PAUSED || this.state === S.LEVEL_COMPLETE) return false;
  if (!this.inputOpen()) return false;
  this.deselect();
  this.pausedFrom = this.state; this.state = S.PAUSED; return true;
};
Game.prototype.resume = function () {
  if (this.state !== S.PAUSED) return;
  this.state = this.pausedFrom || S.READY; this.pausedFrom = null;
};
Game.prototype.hint = function () {
  var res = CORE.solve(this.board, this.rule(), 20000);
  return res.solved && res.moves.length ? res.moves[0] : null;
};

var LW = 540, LH = 960;
var ROW_Y = [262, 356, 450, 544, 638];          // plank top (cat feet) per row
var CAT_W = 49;                                  // slot width (5 per shelf)
var CAT_DRAW = 64;                               // drawn sprite width
var SPR_W = 245;                                 // reference sprite width
var PLANK_H = 15;
var BED_Y = 784;
var FLOOR_Y = 806;
var FONT = '"Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif';
var PODS = [{ x: 186, y: 62, icon: 'pink', mood: 'open', bounce: 0, bv: 0 },
            { x: 270, y: 62, icon: 'red', mood: 'determined', bounce: 0, bv: 0 },
            { x: 354, y: 62, icon: 'video', bounce: 0, bv: 0 }];
var BTN = {
  undo: { x: 150, y: 902, w: 76, h: 70 }, shuffle: { x: 270, y: 902, w: 76, h: 70 },
  bed: { x: 390, y: 902, w: 76, h: 70 }, settings: { x: 486, y: 898, r: 30 }
};
var STAR_PILL = { x: 470, y: 46 }, COIN_PILL = { x: 92, y: 46 };

function shelfSpan(side) { return side === 'left' ? { x0: -14, x1: 250 } : { x0: 290, x1: LW + 14 }; }
function bedX(i, n) { return n <= 2 ? [204, 336][i] : [150, 270, 390][i]; }
function contPos(board, cont) {
  if (cont.kind === 'shelf') {
    var sp = shelfSpan(cont.side);
    return { x: (Math.max(0, sp.x0) + Math.min(LW, sp.x1)) / 2, y: ROW_Y[cont.row] };
  }
  var beds = board.containers.filter(function (c) { return c.kind === 'bed'; });
  return { x: bedX(beds.indexOf(cont), beds.length), y: BED_Y };
}
// updateShelfLayout: deterministic slot position for cat i in a container
function updateShelfLayout(board, cont, i) {
  if (cont.kind === 'shelf') {
    var y = ROW_Y[cont.row];
    var x = cont.side === 'left' ? 3 + CAT_W * (i + 0.5) : LW - 3 - CAT_W * (i + 0.5);
    return { x: x, y: y };
  }
  return contPos(board, cont);
}

  uiButton('verify', 'Dev: verify levels', x + 50, y + 446, 300, 48, GREY, 17);
  if (devResult) devResult.forEach(function (line, k) { text(line, x + w / 2, y + 516 + k * 18, 12.5, '#5b2d0b'); });
  else text('Every level is solver-verified.', x + w / 2, y + 520, 13, '#7a4410');
}

function drawWin(game) {
  var t = Anim.winT; if (t < 0.5) return;
  var a = clamp((t - 0.5) / 0.3, 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,20,50,0.55)'; ctx.fillRect(-300, -300, LW + 600, LH + 600);
  var sc = easeOutBack(clamp((t - 0.5) / 0.4, 0, 1));
  ctx.translate(270, 480); ctx.scale(sc, sc); ctx.translate(-270, -480);
  var x = 80, y = 300, w = 380, h = 390;
  // sunburst behind the celebrating cat
  ctx.save(); ctx.translate(270, 250); ctx.rotate(Anim.time * 0.4);
  for (var r = 0; r < 12; r++) {
    ctx.fillStyle = r % 2 ? 'rgba(255,230,120,0.28)' : 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 170, r * Math.PI / 6, (r + 1) * Math.PI / 6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  var bob = Math.abs(Math.sin(t * 4)) * 8;
  drawCatSprite('red', 'cheer', 270, 318 - bob, 1, 1, 0, 1, 'rgba(255,230,90,0.9)', 120);
  drawPanel(x, y, w, h, 'Level Complete!');
  for (var i = 0; i < 3; i++) {
    var st = clamp((t - 0.9 - i * 0.18) / 0.3, 0, 1);
    if (st > 0) { ctx.save(); ctx.translate(x + w / 2 + (i - 1) * 78, y + 92 - (i === 1 ? 14 : 0)); var s2 = easeOutBack(st); ctx.scale(s2, s2); drawStar(0, 0, i === 1 ? 36 : 30); ctx.restore(); }
  }
  text('Groups sorted: ' + game.stars, x + w / 2, y + 160, 19, '#5b2d0b');
  text('Moves: ' + game.moves + '   Coins +' + CORE.CONFIG.coinsPerLevel, x + w / 2, y + 190, 17, '#7a4410');
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a; ctx.translate(270, 480); ctx.scale(sc, sc); ctx.translate(-270, -480);
  uiButtonsScaled(sc, function () {
    uiButton('next', 'Next Level', x + 60, y + 230, 260, 60, GREEN, 22);
    uiButton('replay', 'Replay', x + 100, y + 306, 180, 48, BLUE, 18);
  });
  ctx.restore();
}
function uiButtonsScaled(sc, fn) {
  var before = uiButtons.length; fn();
  for (var i = before; i < uiButtons.length; i++) {
    var b = uiButtons[i];
    b.x = 270 + (b.x - 270) * sc; b.y = 480 + (b.y - 480) * sc; b.w *= sc; b.h *= sc;
  }
}

function drawToast() {
  var m = Anim.toastMsg; if (!m) return;
  var a = m.t < 0.15 ? m.t / 0.15 : (m.t > m.dur - 0.3 ? Math.max(0, (m.dur - m.t) / 0.3) : 1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = '900 18px ' + FONT; var w = ctx.measureText(m.text).width + 40;
  ctx.fillStyle = 'rgba(25,40,100,0.85)'; rr(ctx, 270 - w / 2, 672, w, 42, 21); ctx.fill();
  text(m.text, 270, 694, 18, '#ffffff');
  ctx.restore();
}

function render() {
  uiButtons = [];
  drawBackground();
  drawRoomProps();
  var board = game.board;
  var canDrop = {};
  if (game.state === S.CAT_SELECTED && game.sel) {
    var si = game.selectedIndex();
    board.containers.forEach(function (c) { if (c.id !== game.sel.contId && game.canMove(game.sel.contId, si, c.id).ok) canDrop[c.id] = 1; });
  }
  board.containers.forEach(function (c) { if (c.kind === 'shelf') drawShelf(c); });
  var beds = board.containers.filter(function (c) { return c.kind === 'bed'; });
  var bsc = beds.length > 2 ? 0.88 : 1;
  beds.forEach(function (b) { var p = contPos(board, b); drawBed(p.x, p.y, 'back', bsc); });
  // drop-target glow spots
  if (game.state === S.CAT_SELECTED) {
    var pulse = 0.35 + 0.25 * Math.sin(Anim.time * 6);
    board.containers.forEach(function (c) {
      if (!canDrop[c.id]) return;
      var cnt = CORE.moveCount(board, game.sel.contId, game.selectedIndex(), c.id, game.rule());
      ctx.fillStyle = 'rgba(255,250,200,' + pulse.toFixed(3) + ')';
      for (var q = 0; q < cnt; q++) {                     // one glow spot per cat that will land here
        var slot = updateShelfLayout(board, c, c.cats.length + q);
        ctx.beginPath(); ctx.ellipse(slot.x, slot.y - 1, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
      }
    });
  }
  var top = [];
  function collect(c) {
    c.cats.forEach(function (cat, i) {
      var v = Anim.visuals[cat.id];
      if (v && (v.jump || v.liftT > 0)) top.push([c, cat, i]); else drawCat(game, c, cat, i);
    });
  }
  // draw rows top to bottom so lower cats overlap shelves above correctly
  board.containers.filter(function (c) { return c.kind === 'shelf'; })
    .sort(function (a, b) { return a.row - b.row; }).forEach(collect);
  beds.forEach(function (b) { collect(b); var p = contPos(board, b); drawBed(p.x, p.y, 'front', bsc); });
  drawChecks(game);
  top.forEach(function (t) { drawCat(game, t[0], t[1], t[2]); });
  Anim.flyers.forEach(function (f) {
    if (f.t < 0) return;
    var u = f.t / f.dur;
    drawCatSprite(f.color, 'sleep', f.x, f.y, f.s, f.s, f.rot, u > 0.85 ? (1 - u) / 0.15 : 1, null);
  });
  drawFxs();
  drawParticles();
  drawPods();
  drawHUD(game);
  Anim.starFlyers.forEach(function (s) { drawStar(s.x, s.y, s.r); });
  drawForeground(-view.offX / view.scale);
  var pid = pressed.id && Anim.time - pressed.t < 0.15 ? pressed.id : null;
  drawBooster(BTN.undo, drawIconUndo, 'Free', game.canUndo() || game.state === S.MOVING && game.history.length > 0, pid === 'undo');
  drawBooster(BTN.shuffle, drawIconShuffle, game.boosters.shuffle > 0 ? 'Free' : 'Used', game.boosters.shuffle > 0, pid === 'shuffle');
  drawBooster(BTN.bed, drawIconBed, game.boosters.bed > 0 && beds.length < 3 ? 'Free' : 'Used', game.boosters.bed > 0 && beds.length < 3, pid === 'bed');
  drawSettingsBtn(pid === 'settings');
  drawHint(game);
  drawToast();
  if (game.state === S.PAUSED) drawSettings(game);
  if (game.state === S.LEVEL_COMPLETE) drawWin(game);
}

/* ===================== INPUT MANAGER ===================== */
function hitTest(x, y) {
  var i, b;
  for (i = uiButtons.length - 1; i >= 0; i--) {
    b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return { type: 'button', id: b.id };
  }
  if (game.state === S.PAUSED || game.state === S.LEVEL_COMPLETE) return { type: 'none' };
  var s = BTN.settings; if (Math.hypot(x - s.x, y - s.y) <= s.r + 8) return { type: 'button', id: 'settings' };
  var keys = ['undo', 'shuffle', 'bed'];
  for (i = 0; i < keys.length; i++) {
    b = BTN[keys[i]];
    if (Math.abs(x - b.x) <= b.w / 2 + 4 && y >= b.y - b.h / 2 - 4 && y <= b.y + b.h / 2 + 12) return { type: 'button', id: keys[i] };
  }
  var board = game.board, best = null, bestD = 1e9;
  board.containers.forEach(function (c) {
    c.cats.forEach(function (cat, k) {
      var p = updateShelfLayout(board, c, k);
      if (x >= p.x - CAT_W / 2 && x <= p.x + CAT_W / 2 && y >= p.y - 74 && y <= p.y + 6) {
        var d = Math.abs(x - p.x); if (d < bestD) { bestD = d; best = { type: 'cat', contId: c.id, idx: k }; }
      }
    });
  });
  if (best) return best;
  for (i = 0; i < board.containers.length; i++) {
    var c = board.containers[i];
    if (c.kind === 'shelf') {
      var sp = shelfSpan(c.side), yy = ROW_Y[c.row];
      if (x >= Math.max(0, sp.x0) && x <= Math.min(LW, sp.x1) && y >= yy - 80 && y <= yy + 22) return { type: 'container', contId: c.id };
    } else {
      var p = contPos(board, c);
      if (Math.abs(x - p.x) <= 60 && y >= p.y - 72 && y <= p.y + 40) return { type: 'container', contId: c.id };
    }
  }
  return { type: 'none' };
}

function handleTap(x, y) {
  var h = hitTest(x, y);
  if (h.type === 'button') { pressed.id = h.id; pressed.t = Anim.time; onButton(h.id); return; }
  if (!game.inputOpen()) return;
  if (game.state === S.READY) {
    if (h.type === 'cat') game.selectCat(h.contId, h.idx);
    return;
  }
  var target = h.type === 'cat' || h.type === 'container' ? h.contId : null;
  if (!target) { game.deselect(); return; }
  if (target === game.sel.contId) {
    if (h.type === 'cat') game.selectCat(h.contId, h.idx); else game.deselect();
    return;
  }
  var res = game.canMove(game.sel.contId, game.selectedIndex(), target);
  if (!res.ok && h.type === 'cat' && res.reason === 'full') {
    var tc = CORE.getC(game.board, h.contId);
    if (game.isPickable(tc, h.idx)) {                    // switch selection to that shelf's outer cat(s)
      game.sel = null; game.state = S.READY; game.selectCat(h.contId, h.idx);
      return;
    }
  }
  game.selectShelf(target);
}

function onButton(id) {
  Sound.click();
  if (id === 'settings') { game.pause(); devResult = null; return; }
  if (id === 'undo') { if (!game.undoMove()) { Sound.invalid(); fx.toast(game.history.length ? '' : 'Nothing to undo'); } return; }
  if (id === 'shuffle') { if (!game.shuffle() && game.boosters.shuffle <= 0) fx.toast('Shuffle already used'); return; }
  if (id === 'bed') { if (!game.addBed()) fx.toast('Extra bed already used'); return; }
  if (id === 'close' || id === 'resume') { game.resume(); return; }
  if (id === 'restart') { game.restartLevel(); return; }
  if (id === 'sound') { Sound.on = !Sound.on; saveProgress(); return; }
  if (id.indexOf('level') === 0) { game.loadLevel(parseInt(id.slice(5), 10)); return; }
  if (id === 'verify') {
    var r = CORE.verifyAllLevels();
    devResult = r.map(function (o) { return 'L' + o.level + ' [' + o.rule + '] ' + (o.valid ? 'valid' : 'INVALID') + ', ' + (o.solved ? 'solved in ' + o.solutionMoves + ' moves' : 'NOT solved') + ' (' + o.nodes + ' nodes)'; });
    if (window.console) console.table(r);
    return;
  }
  if (id === 'next') { game.nextLevel(); return; }
  if (id === 'replay') { game.restartLevel(); return; }
}

canvas.addEventListener('pointerdown', function (ev) {
  ev.preventDefault();
  if (!game) return;
  Sound.init();
  var p = toLogical(ev.clientX, ev.clientY);
  handleTap(p.x, p.y);
}, { passive: false });
['touchstart', 'touchmove', 'gesturestart', 'dblclick'].forEach(function (n) {
  document.addEventListener(n, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
document.addEventListener('visibilitychange', function () { last = performance.now(); });

/* ===================== GAME ENGINE LOOP ===================== */
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { step(dt); render(); } catch (err) { showError(err); return; }
  requestAnimationFrame(frame);
}
function step(dt) {
  Anim.time += dt;
  if (game.state === S.PAUSED) return;
  var moving = reconcile(game, dt);
  updateSeqs(game, dt);
  updateFlyers(dt);
  updateParticles(dt);
  Object.keys(Anim.contShake).forEach(function (k) { Anim.contShake[k] = Math.max(0, Anim.contShake[k] - dt); });
  Anim.starPillBounce = Math.max(0, Anim.starPillBounce - dt * 3);
  Anim.coinPillBounce = Math.max(0, Anim.coinPillBounce - dt * 3);
  if (Math.abs(Anim.displayCoins - game.coins) > 0.5) { Anim.displayCoins += (game.coins - Anim.displayCoins) * Math.min(1, dt * 4); Anim.coinPillBounce = 0.5; }
  else Anim.displayCoins = game.coins;
  if (Anim.toastMsg) { Anim.toastMsg.t += dt; if (Anim.toastMsg.t > Anim.toastMsg.dur || !Anim.toastMsg.text) Anim.toastMsg = null; }
  if (Anim.winT >= 0) Anim.winT += dt;
  if (game.state === S.MOVING && !moving) game.onSettled();
}
function showError(err) {
  var e = document.getElementById('err'); e.style.display = 'flex';
  e.textContent = 'Something went wrong: ' + (err && err.message ? err.message : err);
  if (window.console) console.error(err);
}

/* ===================== BOOT ===================== */
resize();
loadSprites(function (err) {
  if (err) { showError(err); return; }
  try {
    game = new Game(fx);
    var saved = loadProgress();
    if (saved) {
      if (typeof saved.coins === 'number') game.coins = saved.coins;
      if (typeof saved.sound === 'boolean') Sound.on = saved.sound;
    }
    Anim.displayCoins = game.coins;
    var startLevel = saved && typeof saved.level === 'number' ? Math.max(0, Math.min(saved.level, 50)) : 0;
    var lm = /[?&]level=(\d+)/.exec(location.search);
    if (lm) startLevel = Math.max(0, parseInt(lm[1], 10) - 1);
    game.loadLevel(startLevel);
    window.MeowSort.ready = true;
    if (/[?&]dev=1/.test(location.search)) window.MeowSort.verifyLevels();
    requestAnimationFrame(frame);
  } catch (e2) { showError(e2); }
});

/* ===================== DEV / TEST API ===================== */
window.MeowSort = {
  core: CORE, get game() { return game; }, S: S, anim: Anim, pods: PODS, sprites: SPRITES,
  verifyLevels: function () { var r = CORE.verifyAllLevels(); if (window.console && console.table) console.table(r); return r; },
  // Performs the solver's next move through the same selectCat/selectShelf path a player uses.
  step: function () {
    if (!game.inputOpen()) return false;
    var m = game.hint(); if (!m) return false;
    game.deselect();
    return game.selectCat(m.src, m.idx) && game.selectShelf(m.dst);
  },
  tapLogical: function (x, y) { handleTap(x, y); },
  slotScreen: function (contId, idx) {
    var c = CORE.getC(game.board, contId), p = idx < 0 ? contPos(game.board, c) : updateShelfLayout(game.board, c, idx);
    return { x: view.offX + p.x * view.scale, y: view.offY + (p.y - (idx < 0 ? 10 : 22)) * view.scale };
  }
};
})();
</script>
</body>
